---
# Example inventory — the MCP server resolves every host from this file.
# There is no host list inside server.py: alias, address, user and key all
# come from here. Replace the example.com names with your own.
all:
  vars:
    ansible_user: deploy
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519

  children:
    web:
      hosts:
        web-01:
          ansible_host: web-01.example.com
        web-02:
          ansible_host: web-02.example.com

    db:
      hosts:
        db-01:
          ansible_host: db-01.example.com
          ansible_user: dbadmin

    monitor:
      hosts:
        monitor-01:
          ansible_host: monitor-01.example.com

    staging:
      hosts:
        stage-01:
          ansible_host: stage-01.example.com
