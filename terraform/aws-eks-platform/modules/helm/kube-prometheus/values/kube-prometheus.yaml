fullnameOverride: kube-prometheus-stack

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false

prometheus-node-exporter:
  prometheus:
    monitor:
      enabled: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_endpoint_node_name]
          targetLabel: node

grafana:
  enabled: true

  serviceAccount:
    create: false
    name: grafana

  adminUser: admin
  adminPassword: changeme

  replicas: 1

  sidecar:
    dashboards:
      searchNamespace: ALL

  persistence:
    enabled: true
    storageClassName: gp2
    accessModes: ["ReadWriteOnce"]
    size: 1Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - grafana.example.com
    path: /
    tls:
      - hosts:
          - grafana.example.com
        secretName: grafana-tls

  # Datasources
  additionalDataSources:
    - name: CloudWatch
      type: cloudwatch
      access: proxy
      jsonData:
        defaultRegion: eu-central-1

    - name: Alertmanager
      type: alertmanager
      url: http://kube-prometheus-stack-alertmanager.monitoring:9093
      access: proxy
      editable: true
      version: 2
      jsonData:
        implementation: prometheus

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki-stack.logs.svc.cluster.local:3100
          isDefault: false
          editable: true

prometheus:
  serviceAccount:
    create: false
    name: prometheus

  prometheusSpec:
    externalLabels:
      cluster: prod
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    retention: 365d
    retentionSize: 45GiB
    scrapeInterval: 30s

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - prometheus.example.com
    tls:
      - hosts:
          - prometheus.example.com
        secretName: prometheus-tls


alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: slack-notifications
          matchers:
            - severity="critical"

    receivers:
      - name: slack-notifications
        slack_configs:
          - channel: '#aws-prod-monitoring'
            send_resolved: true
            api_url: https://hooks.slack.com/services/REPLACE_WITH_SLACK_WEBHOOK
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: |
              *Alerts:* {{ len .Alerts }}

    inhibit_rules:
      - source_matchers: [severity="critical"]
        target_matchers: [severity=~"warning"]
        equal: ["alertname"]
