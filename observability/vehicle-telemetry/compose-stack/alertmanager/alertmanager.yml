global:
  resolve_timeout: 5m

# Default receiver is 'null' (discards) so Alertmanager starts with no
# credentials configured. Point route.receiver at 'telegram' for raw alerts,
# or at 'triage' to route them through the AI triage agent instead.
route:
  receiver: 'null'
  group_by: ['alertname', 'device_id']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'null'
      group_wait: 0s
      repeat_interval: 30m

receivers:

  - name: 'null'

  # AI triage — the alert-triage service correlates Prometheus + Loki and
  # sends a diagnosis instead of the raw alert. Requires `--profile triage`.
  - name: triage
    webhook_configs:
      - url: 'http://alert-triage:9099/alerts'
        send_resolved: false
        max_alerts: 5

  # Raw Telegram delivery.
  #
  # ⚠ Alertmanager does NOT expand environment variables in this file — a
  # '${TELEGRAM_BOT_TOKEN}' here is sent to Telegram as that literal string.
  # (Verified: the outgoing request path was /bot$%7BTELEGRAM_BOT_TOKEN%7D/…)
  # Hence bot_token_file, which Alertmanager reads at send time, and a chat_id
  # written in plainly — it is an identifier, not a secret.
  #
  # To enable:
  #   1. printf '%s' '<token from @BotFather>' > secrets/telegram-token
  #   2. uncomment below and replace REPLACE_WITH_CHAT_ID
  #   3. point route.receiver at 'telegram'
  #   4. docker compose restart alertmanager
  #
  # - name: telegram
  #   telegram_configs:
  #     - bot_token_file: /etc/alertmanager/secrets/telegram-token
  #       chat_id: REPLACE_WITH_CHAT_ID
  #       api_url: 'https://api.telegram.org'
  #       parse_mode: 'HTML'
  #       message: |
  #         {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} <b>{{ .Status | toUpper }}</b>: {{ .CommonLabels.alertname }}
  #         {{ range .Alerts }}
  #         <b>Device:</b> {{ .Labels.device_id }}{{ if .Labels.wheel }} ({{ .Labels.wheel }}){{ end }}
  #         <b>Severity:</b> {{ .Labels.severity }}
  #         {{ .Annotations.summary }}
  #         {{ if .Annotations.description }}<i>{{ .Annotations.description }}</i>{{ end }}
  #         {{ end }}

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'device_id']
