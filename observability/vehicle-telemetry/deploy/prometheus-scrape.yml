# Add this to your prometheus.yml under `scrape_configs:`
# (Skip if using ServiceMonitor — it picks up the exporter automatically.)

- job_name: 'pandora-exporter'
  scrape_interval: 15s
  scrape_timeout: 10s
  static_configs:
    - targets:
        - 'pandora-exporter:9180'   # docker-compose / k8s Service DNS
        # - 'localhost:9180'        # if running standalone
  metric_relabel_configs:
    # Rename device_id label to vehicle for nicer dashboards (optional)
    - source_labels: [device_id]
      target_label: vehicle
      regex: '(.+)'
      replacement: '${1}'
