{{- if not .Values.pandora.existingSecret }}
# Only rendered when you have not brought your own Secret. In anything beyond a
# scratch cluster, set pandora.existingSecret and keep credentials out of Git —
# Vault, sealed-secrets or SOPS.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vt.pandoraSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vt.labels" . | nindent 4 }}
type: Opaque
stringData:
  PANDORA_LOGIN: {{ .Values.pandora.login | quote }}
  PANDORA_PASSWORD: {{ .Values.pandora.password | quote }}
{{- end }}
