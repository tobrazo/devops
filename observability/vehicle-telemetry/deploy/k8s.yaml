---
# NOTE: use sealed-secrets / Vault in real life. This is illustrative.
apiVersion: v1
kind: Secret
metadata:
  name: pandora-credentials
  namespace: monitoring
type: Opaque
stringData:
  PANDORA_LOGIN: "REPLACE_WITH_PANDORA_LOGIN"
  PANDORA_PASSWORD: "REPLACE_WITH_PANDORA_PASSWORD"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pandora-exporter
  namespace: monitoring
  labels:
    app: pandora-exporter
spec:
  replicas: 1  # singleton — Pandora session cookies don't share between replicas
  strategy:
    type: Recreate  # avoid two sessions fighting during rollout
  selector:
    matchLabels:
      app: pandora-exporter
  template:
    metadata:
      labels:
        app: pandora-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9180"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: exporter
          image: pandora-exporter:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9180
          env:
            - name: PANDORA_HOST
              value: "pro.p-on.ru"
            - name: PANDORA_DEVICE_IDS
              value: "REPLACE_WITH_DEVICE_ID"   # comma-separated; empty = all
            - name: POLL_INTERVAL_SEC
              value: "10"
            - name: LOG_LEVEL
              value: "INFO"
          envFrom:
            - secretRef:
                name: pandora-credentials
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pandora-exporter
  namespace: monitoring
  labels:
    app: pandora-exporter
spec:
  type: ClusterIP
  selector:
    app: pandora-exporter
  ports:
    - name: metrics
      port: 9180
      targetPort: metrics
---
# Optional: if you use Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pandora-exporter
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: pandora-exporter
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
