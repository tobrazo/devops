{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cluster
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis-cluster
  policyTypes:
    - Ingress
  ingress:
    # Intra-cluster: redis pods talk to each other (client + gossip bus).
    - from:
        - podSelector:
            matchLabels:
              app: redis-cluster
      ports:
        - port: {{ .Values.service.port }}
        - port: {{ .Values.service.gossipPort }}
    {{- with .Values.networkPolicy.allowFrom }}
    # Additional clients allowed to reach the client port.
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
