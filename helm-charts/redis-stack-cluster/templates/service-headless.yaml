apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.headless }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: redis-cluster
  ports:
    - port: {{ .Values.service.port }}
      name: client
    - port: {{ .Values.service.gossipPort }}
      name: gossip
