{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: "{{ include "app.mainHost" . }}"
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ .Values.service.activeName }}
                port:
                  number: {{ .Values.service.port }}
  {{- $tls := .Values.ingress.tls | default dict }}
  {{- if and ($tls.enabled) ($tls.secretName) }}
  tls:
    - hosts:
        {{- if $tls.hosts }}
        {{- range $tls.hosts }}
        - {{ . | quote }}
        {{- end }}
        {{- else }}
        - {{ include "app.mainHost" . | quote }}
        {{- end }}
      secretName: {{ $tls.secretName | quote }}
  {{- end }}
  {{- end }}
