{{- if eq .Values.controller.type "rollout" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.activeName }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "app.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  {{- end }}
