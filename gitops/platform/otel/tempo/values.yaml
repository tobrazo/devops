tempo:
  mode: monolithic

  structuredConfig:
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    ingester:
      trace_idle_period: 10s
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: 168h  # 7 days

    metrics_generator:
      enabled: false


memberlist: {}

serviceMonitor:
  enabled: true

persistence:
  enabled: true
  storageClassName: ""  # cluster default; set your StorageClass
  accessModes:
    - ReadWriteOnce
  size: 50Gi
