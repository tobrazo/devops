image:
  repository: centrifugo/centrifugo
  tag: v6
  pullPolicy: IfNotPresent

replicaCount: 1

redis:
  # Bitnami redis (platform/redis) deploys `redis-master` in namespace `redis`.
  host: "redis-master.redis.svc.cluster.local"
  port: 6379

adminWeb:
  # Centrifugo admin_web password. Override per environment / via a Secret.
  password: "changeme"


service:
  type: ClusterIP
  port: 8000
  