apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: tobrazo
  source:
    repoURL: https://github.com/tobrazo/devops
    path: gitops/workloads/nginx
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # The Rollout controller injects the pod-hash into the Service selectors.
  ignoreDifferences:
    - kind: Service
      name: nginx-active
      namespace: nginx-demo
      jsonPointers:
        - /spec/selector
    - kind: Service
      name: nginx-preview
      namespace: nginx-demo
      jsonPointers:
        - /spec/selector
