apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: centrifugo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    environment: prod
spec:
  project: platform
  sources:
    # MAIN source – in-repo Helm chart for Centrifugo
    - repoURL: https://github.com/tobrazo/devops
      targetRevision: main
      path: gitops/platform/centrifugo
      helm:
        releaseName: centrifugo
        valueFiles:
          - $values/gitops/platform/centrifugo/values.yaml
    # SECOND source – required for the $values/ reference above
    - repoURL: https://github.com/tobrazo/devops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: centrifugo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
