apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.previewName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "nginx.fullname" . }}
    role: preview
spec:
  type: ClusterIP
  selector:
    app: {{ include "nginx.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
